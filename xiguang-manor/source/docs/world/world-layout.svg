<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 0 1000 960"><rect width="1000" height="960" rx="24" fill="#272838"/><text x="52" y="72" font-size="29" fill="#f4dfc3" font-family="sans-serif">曦光庄园 · 世界连接规划</text><text x="52" y="112" font-size="17" fill="#c5b7c8" font-family="sans-serif">规划图 · 非游戏截图　　金色：本轮样板　　紫色：保留室内/观景　　灰绿：规划户外/入口</text><g stroke="#b09caa" stroke-width="5" fill="none"><path d="M710 225 L710 355 L500 550 L210 355 L210 225 M210 355 L500 355 L710 355 M210 355 L210 550 L500 550 L790 550 M500 550 L325 730 M500 550 L500 730 M500 550 L675 730 M790 550 L790 830 M210 550 L120 830"/></g><g font-family="sans-serif" text-anchor="middle"><g fill="#475e5e" stroke="#799c8e" stroke-width="2"><rect x="90" y="160" width="240" height="110" rx="18"/><rect x="590" y="160" width="240" height="110" rx="18"/><rect x="90" y="300" width="240" height="110" rx="18"/><rect x="590" y="300" width="240" height="110" rx="18"/><rect x="90" y="495" width="240" height="110" rx="18"/><rect x="670" y="495" width="240" height="110" rx="18"/></g><g fill="#debb91" stroke="#f7e5c7" stroke-width="3"><rect x="375" y="490" width="250" height="120" rx="18"/></g><g fill="#5c4c6c" stroke="#aa8fb8" stroke-width="2"><rect x="230" y="685" width="170" height="95" rx="14"/><rect x="420" y="685" width="170" height="95" rx="14"/><rect x="610" y="685" width="170" height="95" rx="14"/><rect x="660" y="810" width="260" height="90" rx="14"/><rect x="42" y="810" width="220" height="90" rx="14"/></g><g fill="#f2e6d4" font-size="22"><text x="210" y="202">遗迹入口</text><text x="210" y="237" font-size="16">三层路线与撤离保留</text><text x="710" y="202">山顶 · 云阶观日</text><text x="710" y="237" font-size="16">新区域 · 需要完整素材</text><text x="210" y="344">晨露森林</text><text x="210" y="379" font-size="16">树冠/溪流/桥 · 待制作</text><text x="710" y="344">风车果园</text><text x="710" y="379" font-size="16">风车/果树/梯田 · 待制作</text><text x="210" y="538">花谷与秘密花园</text><text x="210" y="573" font-size="16">现有玩法 · 高清区域待制作</text><text x="790" y="538">湖畔与栈桥</text><text x="790" y="573" font-size="16">可走岸线 · 待制作</text><text x="315" y="728">小曦的小屋</text><text x="315" y="757" font-size="14">玩法保留 · 待高清重制</text><text x="505" y="728">晚风花铺</text><text x="505" y="757" font-size="14">已认可的原画一楼</text><text x="695" y="728">糖果工坊</text><text x="695" y="757" font-size="14">全部小游戏保留</text><text x="790" y="846">观星 / 日出 / 烟花</text><text x="790" y="876" font-size="14">已有特殊观景镜头</text><text x="152" y="846">独立极光之夜</text><text x="152" y="876" font-size="14">花海入口 · 保持独立</text></g><g fill="#453746"><text x="500" y="536" font-size="26">玫瑰门庭</text><text x="500" y="572" font-size="17">本轮完整可玩样板</text></g></g><text x="52" y="940" font-size="15" fill="#c5b7c8" font-family="sans-serif">户外逐区制作后再连成流式世界；室内、遗迹楼层、特殊天空镜头保留独立出入口。</text></svg>
