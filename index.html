function grammar(w){if(/would like/i.test(w.ex))return ['“would like” 表示“想要”，比直接说 want 更礼貌。后面可接想要的东西。','I would like some water.（我想要一些水。）'];if(/can /i.test(w.ex))return ['can 表示“能、可以”，后面的动词保持原形，不加 s 或 to。','I can help you.（我可以帮你。）'];if(/\b(am|is|are)\b/.test(w.ex))return ['描述“是谁、在哪里、怎么样”时常用 be：I 配 am，单个人或物配 is，you / we / they 配 are。','She is busy today.（她今天很忙。）'];if(/please/i.test(w.ex))return ['Please 后面直接放动词原形，就能礼貌地请别人做事。','Please speak slowly.（请说慢一点。）'];return ['英语句子通常先说“谁”，再说“做什么”。填空要和句意对应，这里需要 '+w.en+'（'+w.cn+'）。留意例句里这个词的位置。','I need some water.（我需要一些水。）']}
function recordWord(w,ok){let fresh=!S.words[w.en],r=S.words[w.en]||{stage:0,due:0,attempts:0,correct:0};activity(fresh?'new':'review');activity('answers');r.attempts++;if(ok){r.correct++;r.stage=Math.min(4,r.stage+1);r.due=Date.now()+[1,3,7,14][r.stage-1]*86400000}else{r.stage=Math.max(0,r.stage-1);r.due=Date.now()+600000}S.words[w.en]=r;log(`${ok?'掌握':'练习'} ${w.en} · ${fresh?'新词':'复习'}`);reward(ok?10:2,ok?5:0,ok)}
function submitAnswer(value){if(!q||q.answered)return;if(q.context==='challenge'&&Date.now()>=challenge.end){endChallenge();return}if(!normalize(value)){toast('先试着写一个答案吧');return}q.answered=true;let ok=normalize(value)===q.w.en;document.querySelectorAll('#questionArea button,#questionArea input').forEach(b=>b.disabled=true);if(q.context==='challenge'){activity('answers');challenge.score+=ok?1:0;challenge.combo=ok?challenge.combo+1:0;challenge.best=Math.max(challenge.best,challenge.combo);if(ok)reward(3,2+Math.min(5,challenge.combo),true);else save();$('feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}">${ok?'✓ 正确！':'正确答案：'+q.w.en+' · '+q.w.cn}</div><button class="primary wide" onclick="challengeQuestion()">下一题 →</button>`;return}recordWord(q.w,ok);if(ok)study.correct++;let g=grammar(q.w);$('feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}">${ok?'✓ 记住了！ +10 XP · +5 金币':'再试一次也没关系。正确答案：<b>'+q.w.en+'</b>（'+q.w.cn+'）'}<br>${esc(q.w.ex)}<br><span class="muted">${esc(q.w.zh)}</span>${!ok&&q.type===4?`<p>${esc(g[0])}</p><p>相似例句：${esc(g[1])}</p>`:''}</div><div class="row">${!ok?'<button class="secondary" onclick="retryQuestion()">重新尝试（不重复计奖）</button>':''}<button class="primary" onclick="study.index++;studyNext()">继续 →</button></div>`}
function retryQuestion(){let w=q.w,type=q.type;makeQuestion(w,type,'study');q.retry=true;document.querySelectorAll('#questionArea button[data-answer]').forEach(b=>b.onclick=()=>retryAnswer(b.dataset.answer));let f=document.querySelector('#questionArea form');if(f)f.onsubmit=e=>{e.preventDefault();retryAnswer($('answer').value)}}
function retryAnswer(v){if(q.answered)return;let ok=normalize(v)===q.w.en;if(!ok){$('feedback').innerHTML=`<div class="feedback bad">再想想：${q.w.en}（${q.w.cn}）</div>`;return}q.answered=true;document.querySelectorAll('#questionArea button,#questionArea input').forEach(b=>b.disabled=true);$('feedback').innerHTML='<div class="feedback">✓ 这次记住了！下次复习时间保持不变。</div><button class="primary wide" onclick="study.index++;studyNext()">继续 →</button>'}
let challenge=null;function startChallenge(){modal('WORD RUN / 单词快跑',`<h2>用 60 秒，跑出一点自信。</h2><div class="scene-banner">🌳 🏃 🌳</div><p>优先抽取你学过但还不熟的词；尚未学习时从词库抽题。每次答对获得经验和金币，连击加奖。</p><p class="muted">挑战不会改变间隔复习时间，也不计入新词或复习数量。退出会结束本轮，已得奖励保留。</p><button class="primary wide spaced" onclick="beginChallenge()">准备好了，出发！</button>`)}
function beginChallenge(){challenge={end:Date.now()+60000,score:0,combo:0,best:0};challengeQuestion();timer=setInterval(()=>{if(Date.now()>=challenge.end)endChallenge();else updateCountdown()},200)}
function updateCountdown(){if($('countdown'))$('countdown').textContent=Math.max(0,Math.ceil((challenge.end-Date.now())/1000))+'s'}
function challengeQuestion(){if(Date.now()>=challenge.end){endChallenge();return}let pool=words.filter(w=>S.words[w.en]&&S.words[w.en].stage<4);if(!pool.length)pool=words.filter(w=>S.words[w.en]);if(!pool.length)pool=words.slice(0,22);makeQuestion(pool[Math.floor(Math.random()*pool.length)],Math.floor(Math.random()*5),'challenge')}
function endChallenge(){if(!timer&&$('sceneLabel').textContent==='WORD RUN / 挑战完成')return;log(`单词快跑：答对 ${challenge.score} 题，最高连击 ${challenge.best}`);save();modal('WORD RUN / 挑战完成',`<h2>这趟跑得很棒。</h2><div class="scene-banner">🏁 🌻 ✨</div><div class="stats"><div class="stat"><strong>${challenge.score}</strong><span>答对题数</span></div><div class="stat"><strong>${challenge.best}</strong><span>最高连击</span></div></div><p class="muted">本轮金币与经验已实时保存。速度之外，记得多听、多开口。</p><button class="primary wide spaced" onclick="startChallenge()">再跑一次</button>`)}

const NPCS=[{name:'Mia',face:'👩🏻‍🍳',tag:'热情的咖啡师 · 饮食日常',story:'Mia 想邀请你参加周末野餐。',rounds:[['Good morning! What would you like to drink?','早上好！你想喝点什么？',['A tea, please.','I am from China.','It is Monday.'],0,'喝的东西要用饮品回答。“A tea, please.” 是礼貌点单。'],['Would you like some bread with your tea?','喝茶时你想吃些面包吗？',['The station is near.','Yes, please.','My name is Sam.'],1,'Would you like…? 是“你想要……吗？”答 Yes, please 表示接受。'],['Shall we have a picnic this weekend?','这个周末我们去野餐好吗？',['That sounds great!','It costs ten dollars.','Turn left here.'],0,'That sounds great 表示“听起来很棒”，可以用来接受邀请。']]},{name:'Oliver',face:'👨🏼‍💼',tag:'认真的设计师 · 工作交流',story:'Oliver 邀请你一起设计小镇海报。',rounds:[['Are you free this afternoon?','你今天下午有空吗？',['I like coffee.','Yes, after two.','It is blue.'],1,'Are you free…? 在问是否有空。after two 表示两点以后。'],['Can you help me with this report?','你能帮我处理这份报告吗？',['Of course. What do you need?','I am twelve.','It is a train.'],0,'Can you help me…? 是请求帮助，Of course 表示“当然”。'],['When can we finish the plan?','我们什么时候能完成计划？',['Near the park.','It is cheap.','We can finish it tomorrow.'],2,'When 问时间。tomorrow 是明天。can 后面的 finish 用原形。']]},{name:'Lily',face:'👩🏽‍🌾',tag:'温柔的园丁 · 生活闲聊',story:'Lily 想和你一起照料公园的小花园。',rounds:[['How are you feeling today?','你今天感觉怎么样？',['I am a little tired.','It is five dollars.','Go straight.'],0,'How are you feeling? 问感受，tired 表示疲惫。'],['Would you like to take a walk in the park?','你想在公园散散步吗？',['I work in an office.','Yes, that sounds nice.','Two tickets, please.'],1,'take a walk 表示散步。that sounds nice 表示听起来不错。'],['What do you usually do in the morning?','你早晨通常做什么？',['It is on the left.','I need a receipt.','I water the flowers.'],2,'What do you do…? 问你做什么。water 作动词时表示浇水。']]},{name:'Leo',face:'🧑🏻‍🎨',tag:'好奇的旅行者 · 出行问路',story:'Leo 想和你一起画一张小镇旅行地图。',rounds:[['Excuse me, where is the bus station?','打扰一下，公交车站在哪里？',['It is near the bookstore.','I like apples.','See you tomorrow.'],0,'Where 问地点。near 表示在附近。'],['Can I walk there from here?','我能从这里步行过去吗？',['I am busy.','This is my bag.','Yes, it takes five minutes.'],2,'walk there 表示步行到那里。It takes five minutes 表示需要五分钟。'],['Would you like to visit the museum with me?','你想和我一起参观博物馆吗？',['The coffee is hot.','Sure! Let us go together.','I need some milk.'],1,'visit 表示参观，together 表示一起。这是在接受邀请。']]}];
let chat=null;function parkIntro(){modal('BREEZE PARK / 微风公园',`<h2>每一句 Hello，都是故事的开始。</h2><p class="muted">四位邻居，四段日常。理解对话增加好感，三轮后解锁小故事。重复聊天不重复发放首次奖励。</p>${NPCS.map((n,i)=>`<button class="npc" onclick="startChat(${i})"><span class="face">${n.face}</span><div><b>${n.name}</b><small>${n.tag}</small><small>${S.friends[i]>=3?'✦ 已解锁：'+n.story:'好感 '+'♥'.repeat(S.friends[i])+'♡'.repeat(Math.max(0,3-S.friends[i]))}</small></div><span style="margin-left:auto">→</span></button>`).join('')}`)}

function chatRound(){let n=NPCS[chat.i],r=n.rounds[chat.round];modal('PARK / '+n.name,`<div class="row"><span style="font-size:40px">${n.face}</span><div><h2>${n.name}</h2><span class="muted">第 ${chat.round+1}/3 轮 · ${n.tag}</span></div></div><div class="bubble">${r[0]}</div>${audioButtons(r[0])}<button class="secondary spaced" onclick="document.getElementById('translation').classList.toggle('hidden')">查看 / 隐藏中文</button><p class="muted hidden" id="translation">${r[1]}</p><div id="chatOptions" class="spaced">${r[2].map((o,i)=>`<button class="npc" onclick="chatAnswer(${i})">${o}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div>`);speak(r[0])}
function chatAnswer(i){let n=NPCS[chat.i],r=n.rounds[chat.round],ok=i===r[3];if(!ok){$('feedback').innerHTML=`<div class="feedback bad">${r[4]}<br>再试着选择一个合适的回答。</div>`;return}document.querySelectorAll('#chatOptions button').forEach(b=>b.disabled=true);let fresh=chat.round>=S.friends[chat.i];if(fresh){S.friends[chat.i]=chat.round+1;activity('answers');log(`和 ${n.name} 聊天 · 好感 ${S.friends[chat.i]}/3`);reward(15,10,true)}$('feedback').innerHTML=`<div class="feedback">✓ ${r[4]}<br>${fresh?'+1 好感 · +15 XP · +10 金币':'老朋友的温习，也很有意义。'}</div><div class="row"><button class="primary" onclick="nextChat()">${chat.round===2?'看看接下来的故事':'继续聊天 →'}</button><button class="secondary" onclick="startSpeaking(NPCS[chat.i].rounds[chat.round][2][NPCS[chat.i].rounds[chat.round][3]],'练习你刚刚选择的回答')">练习这句回答</button></div>`}
function nextChat(){chat.round++;if(chat.round<3){chatRound();return}let n=NPCS[chat.i];modal('NEW STORY / 新故事解锁',`<div class="scene-banner">${n.face} 🌻 💌</div><h2>你和 ${n.name} 成为了朋友。</h2><p>${n.story}</p><div class="bubble">Thank you for being my friend!</div><p class="muted">谢谢你成为我的朋友！可以再聊一次巩固表达，也可以拜访其他邻居。</p>${audioButtons('Thank you for being my friend!')}<button class="primary wide spaced" onclick="parkIntro()">去见见其他朋友</button>`)}
let speaking=null;function startSpeaking(text,zh){speaking={text,done:false};let supported=!!(window.SpeechRecognition||window.webkitSpeechRecognition);modal('SPEAKING / 勇敢开口',`<h2>不用完美，先说出来。</h2><div class="bubble">${esc(text)}</div><p class="muted">${esc(zh)}</p>${audioButtons(text)}<p class="muted">${supported?'可使用浏览器语音识别（可能需要网络和麦克风权限）。比较仅展示词语匹配，不是发音评分。':'此浏览器不支持语音识别。听后跟读，再手动确认，或用下面的打字练习。'}</p>${supported?'<button class="primary spaced" id="mic" onclick="recognize()">🎙 开始识别</button>':''}<div id="recognition" class="feedback hidden" aria-live="polite"></div><div class="spaced"><input class="answer" id="speechInput" placeholder="也可以在这里默写这句话" autocomplete="off" autocapitalize="none" aria-label="默写英文句子"><button class="secondary spaced" onclick="compareSpeech(document.getElementById('speechInput').value,true)">核对打字内容</button></div><button class="primary wide spaced" id="speakDone" onclick="completeSpeaking()">我已听过并尝试跟读</button><p class="muted">手动确认记录练习次数，不生成语音分数。</p>`)}
function recognize(){try{if(recognizer){recognizer.abort();recognizer=null}let R=window.SpeechRecognition||window.webkitSpeechRecognition;recognizer=new R();recognizer.lang='en-US';recognizer.interimResults=false;recognizer.maxAlternatives=1;$('mic').disabled=true;$('mic').textContent='正在听…';recognizer.onresult=e=>{let text=e.results[0][0].transcript;compareSpeech(text,false)};recognizer.onerror=e=>{if($('recognition')){$('recognition').classList.remove('hidden');$('recognition').textContent='语音识别未完成（权限、网络或浏览器限制）。请使用打字核对或手动跟读确认。'}};recognizer.onend=()=>{if($('mic')){$('mic').disabled=false;$('mic').textContent='🎙 再试一次'}};recognizer.start()}catch(e){toast('识别不可用，请打字练习或手动确认。');if($('mic')){$('mic').disabled=false;$('mic').textContent='🎙 重试识别'}}}
function compareSpeech(value,typed){if(!normalize(value)){toast('请先输入一句英文');return}let expected=normalize(speaking.text),actual=normalize(value),target=expected.split(' '),heard=actual.split(' '),missing=[...target];heard.forEach(w=>{let i=missing.indexOf(w);if(i>=0)missing.splice(i,1)});$('recognition').classList.remove('hidden');$('recognition').textContent=(typed?'你的输入：':'识别文字：')+value+'。'+(expected===actual?'文字与目标句一致。':`请对照原句重试。${missing.length?'可留意：'+[...new Set(missing)].join(', '):'注意词序和多出的词。'}`)+' 这不是发音评分。';if(expected===actual)completeSpeaking()}
function completeSpeaking(){if(speaking.done){toast('这次跟读已经记录，可以继续练习');return}speaking.done=true;activity('speak');log('完成跟读：'+speaking.text);reward(8,3,true);$('speakDone').textContent='✓ 练习已记录 · +8 XP · +3 金币';$('speakDone').disabled=true;toast('勇敢开口 +1，练习已保存')}

function renderStats(){let t=today(),m=Object.values(S.words).filter(r=>r.stage>=3).length;$('main').innerHTML=`<div class="intro"><div><div class="eyebrow">YOUR LITTLE PROGRESS</div><h1>成长，藏在每一天里。</h1><p class="muted">这里的每一个数字，都来自你的真实练习。</p></div></div><div class="card"><div class="stats">${[[t.new,'今日新学单词'],[t.review,'今日复习作答'],[m,'熟练单词 · 熟练度≥3'],[streak(),'连续学习天数'],[t.listen,'今日听力练习'],[1+Math.floor(S.xp/100),'当前英语等级'],[S.xp,'累计经验'],[Object.keys(S.words).length,'累计学过的词'],[Object.values(S.days).reduce((a,d)=>a+d.speak,0),'累计跟读练习']].map(([n,l])=>`<div class="stat"><strong>${n}</strong><span>${l}</span></div>`).join('')}</div><p class="muted">熟练度在 0–4 之间；到达 3 表示至少经历了多次正确回忆。英语等级是游戏成长等级，不等同于语言能力认证。复习次数按首次作答计，题内重试不重复计数。</p></div><div class="card"><h3>最近 7 天的脚印</h3><div class="row between">${Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,r=S.days[k],count=r?Object.values(r).reduce((a,b)=>a+b,0):0;return `<div style="text-align:center;flex:1"><div style="font-size:25px;margin:10px 0">${count?'🌱':'·'}</div><small class="muted">${d.getMonth()+1}/${d.getDate()}</small></div>`}).join('')}</div></div><div class="card"><h3>学习日记</h3>${S.logs.length?S.logs.slice(0,25).map(l=>`<div class="log">${esc(l.text)}<small>${new Date(l.at).toLocaleDateString('zh-CN')}</small></div>`).join(''):'<p class="muted">日记还是空白。去书店认识第一个单词吧。</p>'}</div>`}
window.addEventListener('pagehide',()=>{cleanup();try{localStorage.setItem('english-town-v1',JSON.stringify(S))}catch(e){}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&recognizer)recognizer.abort();if(!document.hidden&&timer&&Date.now()>=challenge.end)endChallenge()});hud();showPage('town');if(!storageOK)setTimeout(()=>toast('本地存储不可用或旧存档无法读取，请使用导出备份。'),500);
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script><script src="./life.js"></script><script src="./world.js"></script></body></html>
